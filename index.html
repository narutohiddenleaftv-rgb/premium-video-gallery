<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Premium Video Gallery</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b1020;color:#fff;font-family:Arial,sans-serif}
header{padding:22px;background:#121b33;border-bottom:1px solid #263553;text-align:center}
header h1{margin:0;color:#60a5fa;font-size:26px}
header p{color:#9caec9;margin-bottom:0}
main{max-width:1000px;margin:auto;padding:20px}
.panel{background:#141e35;padding:22px;border-radius:16px;margin-bottom:22px}
h2{margin-top:0}
input,button{width:100%;padding:13px;margin:8px 0;border-radius:9px;font-size:15px}
input{background:#0b1020;color:white;border:1px solid #344563}
button{background:#2563eb;color:white;border:0;font-weight:bold;cursor:pointer}
button:hover{background:#1d4ed8}
.logout,.delete{background:#dc2626}
.hidden{display:none!important}
.muted{color:#9caec9;font-size:14px}
#message{color:#fca5a5}
#uploadMessage{color:#86efac}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}
.card{background:#141e35;border:1px solid #263553;border-radius:14px;padding:12px;overflow:hidden}
.card video{display:block;width:100%;border-radius:9px;background:#000;aspect-ratio:16/9}
.card h3{overflow-wrap:anywhere}
#empty{text-align:center;padding:20px}
footer{text-align:center;padding:20px;color:#9caec9;font-size:13px}
</style>
</head>
<body>
<header><h1>▶ Premium Video Gallery</h1><p>Watch Your Favorite Videos</p></header>
<main>
<section id="login" class="panel">
<h2>Login</h2>
<form id="loginForm">
<input id="username" type="text" placeholder="Username" autocomplete="username" required>
<input id="password" type="password" placeholder="Password" autocomplete="current-password" required>
<button type="submit">Login</button>
</form>
<p id="message"></p>
</section>
<section id="app" class="hidden">
<div class="panel">
<h2 id="welcome">Welcome</h2>
<p id="roleText" class="muted"></p>
<div id="uploadBox" class="hidden">
<hr><h3>Upload New Video</h3>
<form id="uploadForm">
<input id="videoTitle" type="text" placeholder="Enter video title" required>
<input id="videoFile" type="file" accept="video/*" required>
<button type="submit">Upload Video</button>
</form>
<p id="uploadMessage"></p>
</div>
<button id="logout" class="logout">Logout</button>
</div>
<h2>🎬 Video Library</h2>
<div id="gallery" class="grid"></div>
<p id="empty" class="muted">No videos uploaded yet.</p>
</section>
</main>
<footer>Premium Video Gallery</footer>
<script>
const accounts={
  admin:{password:"admin123",role:"admin"},
  premium:{password:"premium123",role:"viewer"}
};
let currentUser=null,db=null,objectUrls=[];
const $=id=>document.getElementById(id);

const request=indexedDB.open("PremiumGalleryDatabase",1);
request.onupgradeneeded=event=>{
  const database=event.target.result;
  if(!database.objectStoreNames.contains("videos")){
    database.createObjectStore("videos",{keyPath:"id",autoIncrement:true});
  }
};
request.onsuccess=event=>{db=event.target.result;};
request.onerror=()=>{$("message").textContent="Storage open হয়নি। Browser পরিবর্তন করে চেষ্টা করো।";};

$("loginForm").addEventListener("submit",event=>{
  event.preventDefault();
  if(!db){$("message").textContent="Storage প্রস্তুত হচ্ছে। একটু পরে চেষ্টা করো।";return;}
  const username=$("username").value.trim();
  const password=$("password").value;
  const account=accounts[username];
  if(!account||account.password!==password){
    $("message").textContent="Invalid username or password.";return;
  }
  currentUser={username,role:account.role};
  $("message").textContent="";
  $("login").classList.add("hidden");
  $("app").classList.remove("hidden");
  $("welcome").textContent="Welcome, "+currentUser.username;
  $("roleText").textContent=currentUser.role==="admin"
    ?"Admin Mode: Upload and manage videos."
    :"Premium User: Watch videos only.";
  $("uploadBox").classList.toggle("hidden",currentUser.role!=="admin");
  renderVideos();
});

$("logout").addEventListener("click",()=>{
  currentUser=null;
  clearVideoUrls();
  $("app").classList.add("hidden");
  $("login").classList.remove("hidden");
  $("loginForm").reset();
  $("uploadForm").reset();
  $("gallery").replaceChildren();
});

function clearVideoUrls(){
  objectUrls.forEach(url=>URL.revokeObjectURL(url));
  objectUrls=[];
}

function renderVideos(){
  if(!currentUser||!db)return;
  clearVideoUrls();
  const transaction=db.transaction("videos","readonly");
  transaction.objectStore("videos").getAll().onsuccess=event=>{
    if(!currentUser)return;
    const videos=event.target.result;
    $("gallery").replaceChildren();
    $("empty").classList.toggle("hidden",videos.length>0);
    videos.reverse().forEach(video=>{
      const card=document.createElement("article");
      card.className="card";
      const title=document.createElement("h3");
      title.textContent=video.title;
      const player=document.createElement("video");
      player.controls=true;
      player.preload="metadata";
      player.playsInline=true;
      const url=URL.createObjectURL(video.blob);
      objectUrls.push(url);
      player.src=url;
      card.append(title,player);
      if(currentUser.role==="admin"){
        const deleteButton=document.createElement("button");
        deleteButton.className="delete";
        deleteButton.textContent="Delete Video";
        deleteButton.addEventListener("click",()=>{
          if(currentUser?.role!=="admin")return;
          if(!confirm("Are you sure you want to delete this video?"))return;
          const tx=db.transaction("videos","readwrite");
          tx.objectStore("videos").delete(video.id);
          tx.oncomplete=renderVideos;
        });
        card.append(deleteButton);
      }
      $("gallery").append(card);
    });
  };
}

$("uploadForm").addEventListener("submit",event=>{
  event.preventDefault();
  if(!currentUser||currentUser.role!=="admin"||!db)return;
  const title=$("videoTitle").value.trim();
  const file=$("videoFile").files[0];
  if(!title||!file)return;
  if(!file.type.startsWith("video/")){
    $("uploadMessage").textContent="Please select a valid video file.";return;
  }
  $("uploadMessage").textContent="Uploading...";
  const transaction=db.transaction("videos","readwrite");
  transaction.objectStore("videos").add({title,blob:file,createdAt:Date.now()});
  transaction.oncomplete=()=>{
    $("uploadMessage").textContent="Video uploaded successfully!";
    $("uploadForm").reset();
    renderVideos();
  };
  transaction.onerror=()=>{
    $("uploadMessage").textContent="Upload failed. Storage space check করো।";
  };
});
</script>
</body>
</html>
